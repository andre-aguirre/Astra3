<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:" />
<title>Astra3 Drawing</title>
<style>
@font-face { font-family: 'Inter'; src: url('./vendor/InterVariable.woff2') format('woff2'); font-weight: 100 900; }
:root { color-scheme: dark; --bg-0: #0F1216; --bg-1: #161A20; --bg-2: #1D222A; --line: #2A313B;
        --text-0: #E8ECF1; --text-1: #A7B0BC; --text-2: #6E7886; --accent: #8B7CF6; --hint: rgba(15,18,22,.78); }
:root[data-theme="light"] { color-scheme: light; --bg-0: #F6F7F9; --bg-1: #FFFFFF; --bg-2: #F0F2F5; --line: #DDE1E7;
        --text-0: #14181E; --text-1: #4A5260; --text-2: #7A8392; --hint: rgba(255,255,255,.85); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg-0); color: var(--text-0);
             font: 13px/1.45 'Inter', -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
body { display: grid; grid-template-rows: auto 1fr; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
         background: var(--bg-1); -webkit-app-region: drag; }
header .mark { width: 10px; height: 10px; border-radius: 50%; background: var(--text-2); flex: none; }
header .mark.busy { background: var(--accent); box-shadow: 0 0 0 4px rgba(139,124,246,.18); }
header h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .01em; }
header .status { color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
main { display: grid; grid-template-columns: 1fr 260px; min-height: 0; }
#live { position: relative; min-width: 0; min-height: 0; background: var(--bg-0); }
#live .hint { position: absolute; left: 12px; bottom: 10px; z-index: 2; font-size: 11.5px; color: var(--text-1);
              background: var(--hint); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
/* The same gamma (0.8) the saved images get; see GAMMA in engine-view.js. */
#live canvas { filter: url(#tone); }
#live .tools { position: absolute; top: 10px; right: 10px; z-index: 3; display: flex; gap: 6px; }
#live .tools[hidden] { display: none; }
#live .tools button { font: 500 12px/1 'Inter', -apple-system, 'Segoe UI', sans-serif; color: var(--text-0); background: var(--bg-1);
                      border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
#live .tools button:hover { border-color: var(--accent); }
aside { border-left: 1px solid var(--line); background: var(--bg-1); overflow-y: auto; padding: 10px; }
aside h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2);
           margin: 4px 4px 10px; }
.run h3 { font-size: 11.5px; font-weight: 600; color: var(--text-1); margin: 12px 4px 8px; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
.run:first-child h3 { margin-top: 2px; }
.shot { display: block; width: 100%; padding: 6px; margin-bottom: 8px; border-radius: 8px; border: 1px solid var(--line);
        background: var(--bg-2); color: inherit; text-align: left; cursor: pointer; font: inherit; }
.shot:hover, .shot.on { border-color: var(--accent); }
.shot img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: var(--bg-0); border-radius: 4px; }
.shot .meta { display: flex; justify-content: space-between; gap: 6px; margin-top: 5px; font-size: 11.5px; color: var(--text-1); }
.shot .meta span:last-child { white-space: nowrap; }
.shot .meta span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--text-2); padding: 4px; font-size: 12px; }
/* The full-size drawing happens here, out of sight. */
#stage { position: fixed; left: -100000px; top: 0; }
</style>
</head>
<body>
<header>
  <span class="mark" id="mark"></span>
  <h1>Drawing</h1>
  <span class="status" id="status">Waiting for the first image</span>
</header>
<main>
  <div id="live"><span class="hint" id="hint" hidden>Drag to turn, drag along an edge to rotate, scroll to zoom. Choose an image to see its view; drag it out to copy the file.</span>
    <div class="tools" id="tools" hidden>
      <button type="button" id="reset" title="Back to the chosen image's view">Reset</button>
      <button type="button" id="save" title="Save this view as a PNG image, drawn like the images">Save image</button>
    </div></div>
  <aside><h2>Images this session</h2><div id="shots"><div class="empty">None yet</div></div></aside>
</main>
<div id="stage"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="tone" color-interpolation-filters="sRGB">
  <feComponentTransfer><feFuncR type="gamma" exponent="0.8"/><feFuncG type="gamma" exponent="0.8"/><feFuncB type="gamma" exponent="0.8"/></feComponentTransfer>
</filter></svg>
<script src="./vendor/3Dmol-min.js"></script>
<script src="./engine-view.js"></script>
</body>
</html>
